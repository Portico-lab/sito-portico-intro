<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>Portico · Coming soon</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
:root{--night:#14181f;--night2:#1c222c;--terra:#c9653f;--terra-h:#d97a54;--olive:#3e4a3a;--bone:#eceae6;--paper:#f4f3f0;--ink:#1e293b;
--serif:'Cormorant Garamond',Georgia,serif;--sans:'Nunito Sans',system-ui,sans-serif}
html,body{height:100%}
body{font-family:var(--sans);min-height:100svh;overflow-x:hidden;-webkit-font-smoothing:antialiased}
main{min-height:100svh;display:grid;place-items:center;padding:24px 16px;position:relative;isolation:isolate}
.stack{display:flex;flex-direction:column;align-items:center;text-align:center;gap:28px;width:100%;max-width:520px}
.soon{font-family:var(--serif);font-weight:500;letter-spacing:.02em}
.btn{font:700 .8rem/1 var(--sans);letter-spacing:.16em;text-transform:uppercase;padding:16px 28px;border-radius:999px;border:1px solid currentColor;background:transparent;color:inherit;cursor:pointer;transition:.25s}
.notify{display:flex;flex-direction:column}
.notify form{display:flex;gap:8px;width:100%;max-width:440px;flex-wrap:wrap;justify-content:center}
.notify[data-open] [data-open-btn]{display:none}
.notify input{flex:1 1 220px;min-width:0;font:400 1rem var(--sans);padding:15px 20px;border-radius:999px;border:1px solid currentColor;background:transparent;color:inherit;outline:none}
.notify input::placeholder{color:inherit;opacity:.55}
.notify input:focus-visible{box-shadow:0 0 0 3px var(--terra)}
.notify .go{background:var(--terra);border-color:var(--terra);color:#fbfaf8;padding:15px 24px}
.notify .go:hover{background:var(--terra-h);border-color:var(--terra-h)}
.msg{font-size:.88rem;min-height:1.3em;opacity:.85}
.fine{font-size:.75rem;opacity:.5}
.notify{position:fixed;right:max(16px,env(safe-area-inset-right));bottom:max(16px,env(safe-area-inset-bottom));width:auto;max-width:calc(100vw - 32px);align-items:flex-end;gap:6px;z-index:5}
.notify .btn{font-size:.62rem;padding:10px 16px;letter-spacing:.14em}
.notify form{width:auto;max-width:none;flex-wrap:nowrap;gap:6px}
.notify input{flex:0 1 190px;font-size:.8rem;padding:9px 14px}
.notify .go{padding:10px 14px}
.msg{font-size:.72rem;min-height:0;text-align:right}
.msg:empty{display:none}
.notify form[hidden]{display:none}
:focus-visible{outline:2px solid var(--terra);outline-offset:3px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important}}

body{background:#0f1217;color:var(--bone)}
.glow{position:absolute;left:50%;top:50%;width:min(120vw,900px);aspect-ratio:1;translate:-50% -50%;border-radius:50%;opacity:0;transition:opacity 3s ease;
 background:radial-gradient(circle,rgba(201,101,63,.34) 0%,rgba(201,101,63,.1) 35%,transparent 65%);filter:blur(30px);z-index:-1}
.glow.on{opacity:1;animation:breathe 5s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.18);opacity:.65}}
.hd{position:fixed;left:max(20px,4vw);top:max(20px,3.5vw);display:flex;align-items:center;gap:14px;z-index:4}
.hd .p{width:44px;color:var(--bone);opacity:0;transform-origin:0 0;will-change:transform}
.hd .w{width:150px;color:var(--bone);clip-path:inset(0 100% 0 0)}
.type{font-family:var(--serif);font-style:italic;font-weight:500;font-size:clamp(1.7rem,5.4vw,3.2rem);letter-spacing:.01em;min-height:1.3em;padding:0 16px;text-align:center}
.type.c{font-style:normal;font-family:var(--sans);font-weight:600;font-size:1rem;letter-spacing:.42em;text-transform:uppercase;opacity:.85}
.typing::after{content:"";display:inline-block;width:2px;height:.95em;margin-left:4px;background:var(--terra-h);vertical-align:-.1em;animation:blink .8s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.bar{width:min(70vw,300px);height:2px;background:rgba(236,234,230,.14);overflow:hidden;border-radius:2px;transform:scaleX(0);opacity:0}
.bar::after{content:"";display:block;height:100%;width:38%;background:linear-gradient(90deg,transparent,var(--terra),var(--terra-h));animation:sweep 1.9s ease-in-out infinite}
@keyframes sweep{from{transform:translateX(-110%)}to{transform:translateX(290%)}}
.bar.on{transform:scaleX(1);opacity:1;transition:transform .9s cubic-bezier(.2,.7,.2,1),opacity .6s}
.notify{opacity:0;pointer-events:none;transition:opacity 1s}
.notify.show{opacity:1;pointer-events:auto}
.stack{min-height:140px;justify-content:center}
.fade{transition:opacity .7s}
.fade.out{opacity:0}
</style></head><body><main><div class="glow" id="glow"></div>

<div class="stack"><div class="type fade" id="t1"></div><div class="bar" id="bar" role="progressbar" aria-label="In arrivo"></div><div class="type c" id="t2"></div></div>
<div class="notify"><button class="btn" type="button" data-open-btn>Tienimi aggiornato</button>
<form hidden novalidate><input type="email" autocomplete="email" placeholder="La tua email" aria-label="La tua email" required><button class="btn go" type="submit">Avvisami</button></form>
<p class="msg" role="status" aria-live="polite"></p></div></main>
<script>
(async()=>{
const $=id=>document.getElementById(id),sleep=ms=>new Promise(r=>setTimeout(r,ms));
const p=document.querySelector('.hd .p'),w=$('w'),t1=$('t1'),t2=$('t2'),bar=$('bar'),n=document.querySelector('.notify'),glow=$('glow');
const type=async(el,txt,ms)=>{el.classList.add('typing');for(const ch of txt){el.textContent+=ch;await sleep(ms+Math.random()*ms*.8)}await sleep(500);el.classList.remove('typing')};
const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
if(reduce){p.style.opacity=1;w.style.clipPath='none';glow.classList.add('on');bar.classList.add('on');t2.textContent='Coming soon';n.classList.add('show');return}
await sleep(500);
glow.classList.add('on');
await type(t1,'Un modo nuovo di grigliare',70);
await sleep(900);t1.classList.add('out');await sleep(800);t1.textContent='';
const r=p.getBoundingClientRect(),W=Math.min(innerWidth*.42,210),s=W/r.width;
const dx=innerWidth/2-W/2-r.left,dy=innerHeight/2-(r.height*s)/2-r.top;
const big=`translate(${dx}px,${dy}px) scale(${s})`;
p.style.transform=big;
await p.animate([{opacity:0,transform:`translate(${dx}px,${dy}px) scale(${s*.8})`},{opacity:1,transform:big}],{duration:1300,easing:'cubic-bezier(.2,.7,.2,1)',fill:'forwards'}).finished;
p.style.opacity=1;await sleep(600);
await p.animate([{transform:big},{transform:'none'}],{duration:1400,easing:'cubic-bezier(.65,0,.25,1)',fill:'forwards'}).finished;
p.style.transform='none';
await w.animate([{clipPath:'inset(0 100% 0 0)'},{clipPath:'inset(0 0 0 0)'}],{duration:1300,easing:'cubic-bezier(.4,0,.2,1)',fill:'forwards'}).finished;
await sleep(300);
bar.classList.add('on');await sleep(1000);
await type(t2,'Coming soon',95);
n.classList.add('show');
})();
</script><script>
document.querySelectorAll('.notify').forEach(n=>{
 const b=n.querySelector('[data-open-btn]'),f=n.querySelector('form'),i=f.querySelector('input'),m=n.querySelector('.msg');
 b.onclick=()=>{n.setAttribute('data-open','');f.hidden=false;i.focus()};
 f.onsubmit=e=>{e.preventDefault();
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(i.value.trim())){m.textContent='Controlla l’indirizzo email.';i.focus();return}
  f.hidden=true;m.textContent='Fatto. Ti scriviamo appena c’è qualcosa di nuovo.'};
});
</script></body></html>
